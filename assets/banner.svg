<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="RivetRook — AI toolchain manager">
  <title>RivetRook — AI toolchain manager</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.35" stop-color="#60A5FA"/>
      <stop offset="0.7" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1F2937" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="1" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94A3B8" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="#0B0F17"/>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#glowL)"/>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1278" height="338" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- Terminal window controls -->
  <circle cx="38" cy="36" r="7" fill="#F87171" fill-opacity="0.85"/>
  <circle cx="62" cy="36" r="7" fill="#FBBF24" fill-opacity="0.85"/>
  <circle cx="86" cy="36" r="7" fill="#4ADE80" fill-opacity="0.85"/>

  <!-- Wordmark -->
  <text x="640" y="170" text-anchor="middle"
        font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="108" font-weight="800" letter-spacing="-3" fill="url(#brand)">RivetRook</text>

  <!-- Tagline -->
  <text x="640" y="222" text-anchor="middle"
        font-family="'Segoe UI', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="26" fill="#94A3B8">One terminal to install, update and manage every AI coding tool</text>

  <!-- Prompt -->
  <g font-family="'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace" font-size="21">
    <rect x="540" y="252" width="200" height="44" rx="10" fill="#111827" stroke="#1F2937"/>
    <text x="562" y="281" fill="#A78BFA" font-weight="700">❯</text>
    <text x="588" y="281" fill="#E5E7EB">rivetrook</text>
    <rect x="706" y="263" width="11" height="22" rx="2" fill="#22D3EE" fill-opacity="0.85"/>
  </g>
</svg>
